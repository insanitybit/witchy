# cargo-nextest configuration — run the suite with `cargo nextest run`.
# Docs: https://nexte.st/book/configuration
#
# nextest is the preferred local + CI runner: it runs each test in its own
# process (so a panic/abort can't take the runner down), parallelizes across
# the whole suite, and prints a clean per-test summary. There are no doctests
# in this crate, so `nextest run` covers everything `cargo test` did.

# Setup scripts (nextest experimental, stable in practice; nextest-rs/nextest#978):
# warm the wasmtime caches for the embedded pm/coven programs ONCE before any
# server-spawning e2e test runs. The caches are keyed on the witchy binary's
# mtime+size, so every rebuild invalidates them; without this, the first suite
# after a rebuild re-compiles the same embedded programs in EVERY spawned
# subprocess. The script is best-effort and always exits 0.
experimental = ["setup-scripts", "wrapper-scripts"]

[scripts.setup.warm-witchy-caches]
command = "scripts/warm-witchy-caches.sh"
slow-timeout = { period = "150s", terminate-after = 1 }

# macOS can wedge dyld when nextest discovers the workspace's ~100 MB test
# binaries at CPU-count concurrency. Bound only the list phase there; test
# execution retains the profile's normal scheduling and test groups.
[scripts.wrapper.bounded-list]
command = { command-line = "scripts/nextest-list-wrapper.sh", relative-to = "workspace-root" }

[[profile.default.scripts]]
platform = "cfg(target_os = \"macos\")"
list-wrapper = "bounded-list"

[profile.default]
# One retry, profile-wide. Restored after the workspace-test budget was raised
# to 1800s: the first attempt at this was backed out because retries lengthen
# the stage and the old 600s budget -- which already sat below the stage's own
# p90 -- turned red gates into timed-out ones. With the budget above the
# distribution it bounds, retries can do their job.
#
# Why profile-wide rather than per-test: every gate today died on a DIFFERENT
# test sitting at 40-80% of its budget. Naming them one at a time is losing --
# four consecutive RFC-0158 gates, four different unrelated flakes. A retry
# absorbs the whole class. `--max-fail=1:immediate` bounds the added cost to a
# single extra execution of the first failing test.
#
# A test that fails then passes is reported FLAKY and journaled by the
# coordinator (flaky_count/flaky), so this cannot silently hide a rotting
# test -- it makes flakiness countable rather than absorbing it.
retries = 1
# Surface every failure in one run rather than stopping at the first.
fail-fast = false
# Show a failing test's output as it fails, then recap all failures at the end.
failure-output = "immediate-final"
status-level = "fail"
# Flag pathologically slow tests (the registry e2e tests are the slowest) and
# kill anything that hangs well past that.
# 90s x 3 = 270s, raised from 45s x 3 = 135s on 2026-08-26.
#
# Measured with scripts/gate-cap-audit.py over 2,000+ gate logs: 81 tests had
# under 1.6x headroom between this ceiling and the p99 of their own SUCCESSFUL
# runs, and a dozen sat at 1.0-1.2x -- p99 of 110-134s against a 135s kill.
# A test whose healthy p99 is within 20% of its ceiling does not fail when it
# breaks; it fails at random, forever, and reds a whole serialized gate each
# time (--max-fail=1:immediate). That population, not any one flaky test, is
# the dominant source of false gate failures.
#
# Raising the DEFAULT fixes all 81 at once rather than accreting 81 overrides,
# which is the approach that produced the dead filters above. The cost is
# bounded: a genuinely hung test is killed in 270s instead of 135s, against a
# 1800s stage budget.
slow-timeout = { period = "90s", terminate-after = 3 }

# CI profile: `cargo nextest run --profile ci`. Retries absorb the occasional
# flaky network/registry e2e test; JUnit output feeds CI test reporting.
[profile.ci]
fail-fast = false
failure-output = "immediate"
final-status-level = "slow"
retries = 2
slow-timeout = { period = "90s", terminate-after = 2 }

[profile.ci.junit]
path = "junit.xml"

# The registry/coven e2e tests each bind a TCP port and spawn a `witchy` server
# subprocess, then poll for readiness. Run concurrently across the whole suite,
# many servers compile + start under heavy CPU contention and a few overrun
# their readiness window — false failures that always pass in isolation (the
# long-standing "don't run two suites at once" flakiness). Bound them to a
# small group so server spawns stay rare; the rest of the suite still
# parallelizes fully.
#
# Width 2 (was 1): the merge-queue coordinator now guarantees at most ONE
# heavyweight suite runs at a time (scripts/merge-queue.sh), which removes the
# machine-wide contention that motivated full serialization — and ~40% of the
# spawning tests had drifted out of the old keyword filter and were running
# concurrently anyway, without flaking. The group is ~90% of the gate's test
# stage, so width 2 nearly halves gate wall-clock. The single per-group retry
# absorbs a rare readiness overrun without masking real failures (a genuinely
# red test fails twice).
[test-groups]
registry-serial = { max-threads = 2 }
perf-serial = { max-threads = 1 }
wasm-heavy = { max-threads = 2 }
gate-cold-heavy = { max-threads = 4 }
queue-concurrency-serial = { max-threads = 1 }

# These two hermetic fixtures each create concurrent coordinator/metadata
# writers. Running both races at once has no additional coverage, but doubles
# process and lock pressure enough to make both hit nextest's 135s hard timeout
# on an otherwise green gate. Keep every assertion and the existing timeout;
# serialize only the two nested-concurrency fixtures while the rest of the
# queue-infrastructure shard retains width two.
[[profile.default.overrides]]
filter = 'binary_id(witchy::merge_queue) & test(/^concurrent_daemon_starts_create_exactly_one_coordinator$|^concurrent_dependency_updates_cannot_commit_opposite_cycle_edges$/)'
test-group = 'queue-concurrency-serial'

# Bound cold, compiler-heavy test binaries without serializing unrelated tests.
[[profile.default.overrides]]
filter = 'binary_id(witchy::glamour) | (binary_id(witchy::misc) & not test(/repository_census_matches_the_checked_in_type_resolved_snapshot/)) | binary_id(witchy::rfc0005) | binary_id(witchy::rfc0080) | binary_id(witchy::rfc0081_existential_frontend) | binary_id(witchy::rfc0090) | binary_id(witchy::rfc0092) | binary_id(witchy::test_for_paths) | binary_id(witchy::worktree) | (binary_id(witchy::bin/witchy) & test(/^(cli_flag_tests|compiled_build_step_tests)::/)) | (binary_id(witchy-lower) & test(/^analysis::(fip_tests|last_use_tests)::/)) | (binary_id(witchy-syntax) & test(/^aliases::tests::/))'
test-group = 'gate-cold-heavy'

# The `commands::web::tests` group compiles a full glamour program per test,
# each driving the multi-core Wasm compiler. Left at the default group they
# thundering-herd the compiler under a busy gate; the heaviest
# (`typed_island_plan_erases_only_after_program_model_and_view_agree`) runs
# ~120s standalone and tipped the default 135s slow-kill after 2,597 tests
# passed on 2026-08-04 (the sole timeout on an otherwise-green gate). Bound them
# in the width-4 cold-heavy group AND widen the slow-timeout to 240s so one
# uninterrupted run clears the real runtime with headroom; assertions and the
# bounded 480s (2 x 240s) hard cap are unchanged.
[[profile.default.overrides]]
filter = 'binary_id(witchy::bin/witchy) & test(/^commands::web::tests::/)'
test-group = 'gate-cold-heavy'
slow-timeout = { period = "240s", terminate-after = 2 }
priority = 80

# Same shape as `commands::web::tests` above: each compiles/renders a full
# glamour program through the multi-core Wasm compiler. Already run in
# gate-cold-heavy via binary_id(witchy::glamour)/binary_id(witchy::bin/witchy),
# but without a widened timeout, so they were exposed to the default 135s
# slow-kill. Measured standalone: the `witchy::glamour dom::*` tests run
# 47-95s baseline; `example_tests::glamour::
# glamour_media_policy_css_and_loader_share_one_query_corpus` TIMED OUT at
# 135s twice in a row under concurrent-gate load (2026-08-09) despite no
# code-path relation to the change being gated -- pure contention, same
# failure shape as the census/docs-bundle/web::tests entries above. Same
# remedy: widen the period so one uninterrupted run clears the real runtime
# with headroom.
[[profile.default.overrides]]
filter = 'test(/^dom::(glamour_island_completion_frames_agree_on_both_backends|glamour_island_host_work_frames_agree_on_both_backends|glamour_structural_patch_frames_agree_on_both_backends|glamour_version_and_trust_views_render_security_fields)$|^html_nul::html_rejects_static_nul_without_affecting_real_holes_or_strings$|^example_tests::glamour::glamour_media_policy_css_and_loader_share_one_query_corpus$/)'
test-group = 'gate-cold-heavy'
slow-timeout = { period = "240s", terminate-after = 2 }
priority = 80

# `cli_subcommands::{web_commands_route_natively_and_complete_clean_clone_flow,
# static_web_flow_needs_no_client_scaffold_or_browser_runtime,
# web_doctor_deployment_headers_check_declared_route_policy}` each spawn the
# real `witchy` binary through a full `new`/`test --web`/`build --web`/`doctor`
# flow (the third also runs a real header-probe server) — same shape as
# `commands::web::tests` above (a full glamour program compiled through the
# multi-core Wasm compiler, just out-of-process). Measured ~53s standalone but
# TIMED OUT at the default 135s slow-kill in a full-suite run (2026-08-09)
# purely from concurrent CPU contention — passes every time in isolation.
# `web_doctor_deployment_headers_check_declared_route_policy` was added after
# being missed by the original two-name list and independently timing out
# under the same load (2026-08-09): a per-test name allowlist keeps missing
# siblings that share the underlying cost shape — if a NEW `--web`-flow test
# is added to this file, add it here too rather than waiting for it to time
# out first. Same remedy: bound to the width-4 cold-heavy group and widen the
# timeout so one uninterrupted run clears the real cost with headroom.
[[profile.default.overrides]]
filter = 'binary_id(witchy::cli_subcommands) & test(/web_commands_route_natively_and_complete_clean_clone_flow|static_web_flow_needs_no_client_scaffold_or_browser_runtime|web_doctor_deployment_headers_check_declared_route_policy/)'
test-group = 'gate-cold-heavy'
slow-timeout = { period = "240s", terminate-after = 2 }
priority = 80

# Long-running regression guards: the at-scale perf programs can exceed the
# default 135s slow-kill under a busy gate. Serialize them in their own group,
# start them early, and retain a bounded hard cap; assertions are unchanged.
[[profile.default.overrides]]
filter = 'test(/list_reverse_flatten_flat_map_are_linear_at_scale|inplace_set_at_is_fast_and_alias_safe|inplace_update_at_is_fast_and_alias_safe/)'
test-group = 'perf-serial'
slow-timeout = { period = "240s", terminate-after = 2 }
priority = 90

# `chan_throughput_bounded_by_rc_floor` asserts a channel throughput FLOOR, so
# it is inherently sensitive to how much CPU it actually gets. Measured
# 2026-08-26: it takes 99.5s in isolation on an idle box -- 74% of the default
# 135s slow-kill -- so any contention at all pushes it over. It has taken 9+
# gates red across 5 unrelated branches since 2026-08-12, and because nextest
# fail-fast cancels the run, each timeout also SIGTERMs ~7 innocent tests and
# skips the remaining ~3,000, turning one slow test into a whole red gate.
# Same treatment as the perf tests above: one-wide, early, bounded hard cap.
# Assertions unchanged.
[[profile.default.overrides]]
filter = 'test(/chan_throughput_bounded_by_rc_floor/)'
test-group = 'perf-serial'
slow-timeout = { period = "240s", terminate-after = 2 }
# Retry only the tests we have evidence are flaky. A profile-wide retry was
# tried first and was worse: it lengthens the whole stage against the hard 600s
# MERGE_QUEUE_WORKSPACE_TEST_BUDGET, trading a red gate for a timed-out one.
retries = 1
priority = 90

# The RFC-0152 scheduler/select stats tests instantiate whole async programs
# and count scheduler transitions, so their runtime tracks CPU availability.
# Measured across 2,014 gate logs (scripts/gate-test-cost.py + per-test
# aggregation): these sit at 42-63% of the default 135s slow-kill at p50, which
# is not a margin -- it is a budget that any contention exhausts. One of them
# (sole_live_fixed_select_frames…, p50 84.9s) red the very gate that was
# landing the fix for chan_throughput_bounded_by_rc_floor.
#
# Widened rather than serialized: unlike the throughput floors above these do
# not assert a rate, so they are correct when slow -- they only need to be
# allowed to finish. Bounded 2 x 240s hard cap; assertions unchanged.
[[profile.default.overrides]]
filter = 'test(/sole_live_fixed_select_frames_drain_before_one_reusable_wait_install|sole_live_receive_frame_drains_a_buffered_run_before_installing_wait|sole_live_select_frame_drains_a_buffered_source_order_run|rfc0152_actor_mailbox_preserves_request_order|rfc0152_guarded_paths_preserve_both_outcomes_and_backend_parity|compiler_frame_registration_is_bounded_through_cancel_and_close/)'
slow-timeout = { period = "240s", terminate-after = 2 }
retries = 1
priority = 85

# The fuzz binary's own per-seed budget (WITCHY_FUZZ_TIMEOUT_SECS, 180s) must
# sit BELOW nextest's kill threshold, or the internal timeout can never fire --
# nextest SIGKILLs first and the careful "TIMED OUT on seed N" diagnostic is
# lost. That inversion was introduced on 2026-08-26 by raising the internal
# budget 60s -> 180s while the binary still ran on the profile default of
# 45s x 3 = 135s: the test stopped failing fast at 60s and started being killed
# at 135s instead, which moved the failure rather than removing it.
# 240s x 2 = 480s leaves the 180s internal budget room to fire and report.
[[profile.default.overrides]]
filter = 'binary_id(witchy::differential_fuzz)'
slow-timeout = { period = "240s", terminate-after = 2 }
priority = 80

# RFC-0129's million-message measurements create a Wasmtime instance per
# sample and therefore peak far above ordinary unit-test memory.  They are
# correctness and allocation guards, not throughput that benefits from
# concurrent execution; one-wide prevents unrelated compiler-heavy tests from
# being SIGKILLed under the shared merge gate.
[[profile.default.overrides]]
filter = 'binary_id(witchy::rfc0129_scalar_executor_performance)'
test-group = 'perf-serial'
slow-timeout = { period = "240s", terminate-after = 2 }
priority = 90

# The type-resolved repository census (the sole timeout after 2,284 tests
# passed on 2026-07-18, then again after 2026-08-04 and 2026-08-09). It runs
# ~113-123s standalone — always well inside a 240s period — but hit the full
# 480s (2 × 240s) hard cap THREE separate times under concurrent-gate load,
# confirming this is contention-starvation, not a regression (isolated runs
# stay green every time). Local dev-machine contention has now caught up to
# the GitHub-runner slowdown that already forced CI to 600s (2026-08-07);
# apply the same widened period locally instead of just in CI.
[[profile.default.overrides]]
filter = 'test(/repository_census_matches_the_checked_in_type_resolved_snapshot/)'
test-group = 'perf-serial'
slow-timeout = { period = "600s", terminate-after = 2 }
priority = 90

# GitHub-hosted runners are several times slower still; keep the CI profile
# at parity with the (now equally widened) local default above.
[[profile.ci.overrides]]
filter = 'test(/repository_census_matches_the_checked_in_type_resolved_snapshot/)'
test-group = 'perf-serial'
slow-timeout = { period = "600s", terminate-after = 2 }
priority = 90

# The docs-bundle proof builds the FULL book (every route) through the static
# publisher, so its runtime scales with book size: ~7s at 43 routes, ~72-74s
# at 56 routes after the 2026-08-06 cookbook expansion. Under a busy gate that
# tips the default 135s slow-kill (sole timeout on an otherwise-green gate,
# 2026-08-06 — same failure shape as the census on 07-18 and web::tests on
# 08-04). Same remedy: widen the period so one uninterrupted run clears the
# real runtime with headroom, keeping a bounded 480s (2 x 240s) hard cap. It
# already runs in gate-cold-heavy via binary_id(witchy::glamour); this override
# only widens its timeout.
[[profile.default.overrides]]
filter = 'test(/glamour_docs_bundle_renders_the_real_book/)'
test-group = 'gate-cold-heavy'
# Killed at its full 480s ceiling in the 2026-08-26 RFC-0158 batch; slow, not
# flaky, so more ceiling and no retry.
slow-timeout = { period = "600s", terminate-after = 2 }
retries = 0
priority = 85

# Serial-tail elimination: these tests are slow AND sort late by name, so at
# default priority they were the last to COMPLETE every gate — `wir_binary_path`
# (~9s) and the heavy differential/example-matrix tests trailed the bulk. (The
# `stdlib_properties` proptests used to lead this list at ~19s; the linker's
# pulled-std expansion cache cut them to ~2-4s, below the bar.) Running
# alone at the end wastes ~9 idle cores for the length of the longest straggler.
# priority 90 dispatches them at the front so they overlap the parallel bulk
# instead of extending the tail. Each process also drives the multi-core Wasm
# compiler; starting the whole set together can make every member exceed the
# 135s timeout on a cold cache. Width 2 keeps useful overlap without the
# compiler thundering herd. Contended merge gates have repeatedly pushed
# `documentation_examples_are_valid` past the default 135s hard kill despite
# passing in isolation, so retain a bounded 480s cap like the other cold-heavy
# compiler tests above. Keep this list to tests measured >8s that also sort
# late; re-check with the per-test timings in a merge-queue gate log.
[[profile.default.overrides]]
filter = 'test(/^example_tests::([a-z0-9_]+::)?wir_binary_path_runs_and_agrees_with_oracle$|^example_tests::([a-z0-9_]+::)?(documentation_examples_are_valid|all_examples_validate_via_cli|every_example_agrees_under_unbox|every_compilable_example_agrees_on_both_backends|every_example_agrees_under_rc_floor|examples_agree_under_rc_floor|examples_agree_under_inplace_and_forced_copy|all_examples_run_via_cli|book_examples_manifest_is_current)$|^example_tests::range_for_properties::/) | test(/differential_sweep_output_is_invariant_on_both_backends/)'
test-group = 'wasm-heavy'
slow-timeout = { period = "240s", terminate-after = 2 }
priority = 90

# Keep the full binary identity on the recurring example-sweep timeouts. The
# broader example-sweep override above is intentionally retained for its
# group/priority policy, but the serialized queue has observed these full
# compiler sweeps fall through to the default timeout. These literal rules are
# the bounded failure-policy authority for the tests.
[[profile.default.overrides]]
filter = 'binary_id(witchy::bin/witchy) & test(/^example_tests::example_sweeps::(documentation_examples_are_valid|all_examples_validate_via_cli)$/)'
test-group = 'wasm-heavy'
# Raised 240s -> 360s (2026-08-26): TRY 1 hit the full 480s ceiling at 0.6
# load per core, an IDLE box, where this test's own p50 is 49.7s. A 10x
# outlier on an idle machine is the cold first run in a freshly rebased gate
# worktree, not contention -- so the ceiling, not the machine, was the bug.
slow-timeout = { period = "600s", terminate-after = 2 }
# retries = 0 deliberately. These are SLOW, not flaky: they were killed at 480s
# on BOTH attempts in the 2026-08-26 RFC-0158 batch, so the retry doubled their
# cost and could not help. Retry the jittery population, never the slow one --
# applying one profile-wide retry to both failure modes is what made the stage
# overrun. Aggregate p99 under-provisions these specifically, because the gate
# always runs a freshly rebased COLD worktree while the aggregate is dominated
# by warm runs.
retries = 0
priority = 90

[[profile.ci.overrides]]
filter = 'test(/^example_tests::([a-z0-9_]+::)?wir_binary_path_runs_and_agrees_with_oracle$|^example_tests::([a-z0-9_]+::)?(documentation_examples_are_valid|all_examples_validate_via_cli|every_example_agrees_under_unbox|every_compilable_example_agrees_on_both_backends|every_example_agrees_under_rc_floor|examples_agree_under_rc_floor|examples_agree_under_inplace_and_forced_copy|all_examples_run_via_cli|book_examples_manifest_is_current)$|^example_tests::range_for_properties::/) | test(/differential_sweep_output_is_invariant_on_both_backends/)'
test-group = 'wasm-heavy'
priority = 90

# Keyword filter: nextest can only match on names, so this must cover every
# test that spawns a registry/coven server (RegistryServer::start() or raw
# coven dispatch in tests/e2e.rs). If you add a spawning test, either match an
# existing keyword or extend this list — `cargo nextest show-config test-groups`
# shows current membership.
[[profile.default.overrides]]
filter = 'binary_id(witchy::e2e) & test(/coven|publish|promote|resolv|lifecycle|release|widen|glamour_publishes|pm_add|yank|trusted|api_docs|diamond|cool_down|consent|serves|tuf|vendored|registry|provenance|outdated|tree_shows|std_shadowing|module_name_collision|update_single|upgrade|transitive/)'
test-group = 'registry-serial'
retries = 1
# Start the serialized long pole FIRST so it overlaps the parallel tail
# instead of running after it (nextest runs same-priority tests in name
# order; priority range is -100..=100, higher starts earlier).
priority = 100

# Interpreter server tests perform the same bind/spawn/connect readiness loop
# as the registry e2e tests. Under a compiler-heavy gate, running four of them
# at once can exhaust their one-second startup window even though the server is
# healthy. Share the existing two-wide server group instead of retrying the
# entire semantic batch after a load-only connect failure.
[[profile.default.overrides]]
filter = 'test(/^interpreter::tests::(net_server_listen_accept_roundtrip|serve_loopback_roundtrip|http_client_builder_loopback|serve_status_constructors_roundtrip|serve_method_not_allowed_vs_not_found|serve_var_receiver_method_resolution|serve_any_method_route_roundtrip|serve_middleware_nest_and_notfound_roundtrip|serve_json_handler_roundtrip|serve_json_body_decode_roundtrip|serve_form_field_roundtrip|serve_static_files_roundtrip)$/)'
test-group = 'registry-serial'
retries = 1
priority = 100

[[profile.default.scripts]]
filter = 'binary_id(witchy::e2e)'
setup = 'warm-witchy-caches'

[[profile.ci.overrides]]
filter = 'binary_id(witchy::e2e) & test(/coven|publish|promote|resolv|lifecycle|release|widen|glamour_publishes|pm_add|yank|trusted|api_docs|diamond|cool_down|consent|serves|tuf|vendored|registry|provenance|outdated|tree_shows|std_shadowing|module_name_collision|update_single|upgrade|transitive/)'
test-group = 'registry-serial'

[[profile.ci.overrides]]
filter = 'test(/^interpreter::tests::(net_server_listen_accept_roundtrip|serve_loopback_roundtrip|http_client_builder_loopback|serve_status_constructors_roundtrip|serve_method_not_allowed_vs_not_found|serve_var_receiver_method_resolution|serve_any_method_route_roundtrip|serve_middleware_nest_and_notfound_roundtrip|serve_json_handler_roundtrip|serve_json_body_decode_roundtrip|serve_form_field_roundtrip|serve_static_files_roundtrip)$/)'
test-group = 'registry-serial'
