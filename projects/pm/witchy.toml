# The witchy package manager — a self-hosted rune. It reads witchy.toml manifests,
# audits a rune's capability footprint, and guards dependency upgrades against any
# widening of authority. The embedded `witchy pm` command runs the front-end on
# the compiled WASM tier while granting the host capabilities it needs.
[rune]
name = "pm"
version = "0.1.0"

# Declared footprint — a reviewable contract; the toolchain recomputes and would
# error on mismatch. The pm reads/writes project files (Dir), prints (Console),
# `add` fetches runes from a registry (Net), `run` drives the compiler via the
# Exec capability, `publish` reads COVEN_ID_TOKEN (Env) for trusted publishing, and
# `add`'s staging-cooldown gate reads the wall clock (Clock)
# See README.md: this source is embedded by the native CLI.
[capabilities]
runtime = ["Console", "Dir", "Net", "Exec", "Env", "Clock"]

[dependencies]
