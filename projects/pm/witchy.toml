# The witchy package manager — a self-hosted rune. It reads witchy.toml manifests,
# audits a rune's capability footprint, and guards dependency upgrades against any
# widening of authority. It runs on the interpreter (it uses `compiler.footprint`,
# a host introspection intrinsic), the way a build tool is allowed to.
[rune]
name = "pm"
version = "0.1.0"

# Declared footprint — a reviewable contract; the toolchain recomputes and would
# error on mismatch. The pm reads/writes project files (Dir) and prints (Console).
[capabilities]
runtime = ["Console", "Dir"]

[dependencies]
