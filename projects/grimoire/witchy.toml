# Grimoire — the witchy package manager, a self-hosted rune. It reads witchy.toml
# manifests, audits a rune's capability footprint, and guards dependency upgrades
# against any widening of authority. The embedded `witchy grimoire` command (and its
# `witchy pm` compat alias) runs the front-end on the compiled WASM tier while
# granting the host capabilities it needs.
[rune]
name = "grimoire"
version = "0.1.0"

# Declared footprint — a reviewable contract; the toolchain recomputes and would
# error on mismatch. Grimoire reads/writes project files (Dir), prints (Console),
# `add` fetches runes from a registry (Net), `run` drives the compiler via the
# Exec capability, `publish` reads COVEN_ID_TOKEN (Env) for trusted publishing, and
# `add`'s staging-cooldown gate reads the wall clock (Clock)
# (rfcs/0004-self-hosted-cli.md).
[capabilities]
runtime = ["Console", "Dir", "Net", "Exec", "Env", "Clock"]

[dependencies]
