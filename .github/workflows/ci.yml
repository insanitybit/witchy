name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege by default: grant nothing at the top level, opt each job in.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  zizmor:
    name: Workflow security audit (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/zizmor.sh --quiet --no-progress --persona=pedantic .github/workflows

  test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust
        with:
          components: clippy
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: nextest
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit + integration tests
        run: cargo nextest run --workspace --profile ci --all-targets

  heap-check:
    name: Checked heap (RFC-0023)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: nextest
      # The opt-in checked heap (redzones + a post-run shadow sweep) makes
      # intra-linear-memory corruption loud — out-of-object writes wasmtime cannot see.
      # The differential fuzzer is the coverage engine (random heap-heavy programs run
      # through the real runtime); under the flag it becomes the depth oracle too, turning
      # "is our codegen/allocator memory-safe?" into a property the run checks. (Scoped to
      # real-runtime behavior tests: codegen unit tests hand-roll minimal wasmtime linkers
      # that don't define the checked-heap imports, so they run unflagged in `test`.)
      - name: Differential fuzzer under WITCHY_HEAP_CHECK
        env:
          WITCHY_HEAP_CHECK: "1"
        run: cargo nextest run --profile ci --test differential_fuzz

  parity:
    name: Backend parity sweep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust
      - name: Build release binary
        run: cargo build --release
      - name: Differential check every runnable example on both backends
        run: |
          fail=0
          for f in examples/*/src/*.witchy; do
            out=$(./target/release/witchy parity "$f" 2>&1) || true
            if echo "$out" | grep -qi "DIVERGE"; then
              echo "DIVERGENCE: $f"
              echo "$out"
              fail=1
            fi
          done
          exit $fail

  acceptance:
    name: From-scratch acceptance (e2e-full)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust
      - name: Run the acceptance script (test suites run in their own job)
        run: ./scripts/e2e-full.sh --quick

  # RFC-0041: the book IS a witchy/glamour app (empty host footprint), compiled to
  # wasm and served client-side. Build the deployable bundle and publish it to GitHub
  # Pages. NOTE (reviewed trade-off): GitHub Pages does NOT honor the bundle's `_headers`,
  # so the strict COOP/COEP/CORP isolation it ships is inert here. The runnable cells run
  # a capability-DENIED pure-compute wasm (deny-by-omission), so they are contained by
  # wasm isolation rather than by cross-origin isolation; the compiler is single-threaded
  # (no SharedArrayBuffer), so it needs no isolation to run. To restore strict isolation,
  # deploy the same bundle to a `_headers`-honoring host (Cloudflare Pages / Netlify).
  # Split privilege (house rule): docs-build holds only `contents: read` and emits the
  # artifact; the privileged deploy is a separate job.
  docs-build:
    name: Build the docs bundle
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust
        with:
          targets: wasm32-unknown-unknown
      - name: Build the release binary (compiles the docs app to wasm via build-docs.sh)
        run: cargo build --release
      - name: Build the browser compiler wasm (the Run buttons)
        run: |
          cargo build --release --lib --no-default-features --target wasm32-unknown-unknown
          mkdir -p web
          cp target/wasm32-unknown-unknown/release/witchy.wasm web/witchy.wasm
      - name: Assemble the deployable bundle
        run: ./scripts/build-docs.sh dist
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  docs-deploy:
    name: Deploy the docs to GitHub Pages
    if: github.ref == 'refs/heads/master'
    needs: docs-build
    runs-on: ubuntu-latest
    # The ONLY job with write authority — and only the two rights a Pages deploy needs.
    permissions:
      pages: write
      id-token: write
    # Serialize Pages deploys without blocking the rest of CI.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  playground:
    name: Playground wasm build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust
        with:
          targets: wasm32-unknown-unknown
      - name: Build the interpreter for the browser
        run: cargo build --release --lib --no-default-features --target wasm32-unknown-unknown
      - name: Stage the wasm next to the page
        run: |
          mkdir -p web
          cp target/wasm32-unknown-unknown/release/witchy.wasm web/witchy.wasm
      # RFC-0041 P3: run every `runnable` book block through the SHIPPED browser wasm and assert
      # its output equals the committed manifest oracle — the no-silent-drift gate for the
      # runnable book (an in-book Run can never diverge from the toolchain).
      - name: Validate the runnable book against the manifest oracle
        run: node scripts/validate_book_examples.mjs

  fmt:
    name: Formatting check (std + examples)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust
      - name: Build release binary
        run: cargo build --release
      - name: witchy fmt --check
        run: |
          fail=0
          for f in std/*.witchy examples/*/src/*.witchy; do
            if ! ./target/release/witchy fmt --check "$f" >/dev/null 2>&1; then
              echo "needs formatting: $f"
              fail=1
            fi
          done
          exit $fail
