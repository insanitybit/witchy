name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege by default: grant nothing at the top level, opt each job in.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  zizmor:
    name: Workflow security audit (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/zizmor.sh --quiet --no-progress --persona=pedantic .github/workflows

  test:
    name: Build, lint, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2.82.5
        with:
          tool: nextest
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit + integration tests
        run: cargo nextest run --workspace --profile ci --all-targets

  parity:
    name: Backend parity sweep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build release binary
        run: cargo build --release
      - name: Differential check every runnable example on both backends
        run: |
          fail=0
          for f in examples/*.witchy; do
            out=$(./target/release/witchy parity "$f" 2>&1) || true
            if echo "$out" | grep -qi "DIVERGE"; then
              echo "DIVERGENCE: $f"
              echo "$out"
              fail=1
            fi
          done
          exit $fail

  acceptance:
    name: From-scratch acceptance (e2e-full)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Run the acceptance script (test suites run in their own job)
        run: ./scripts/e2e-full.sh --quick

  book:
    name: Build the book
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the book
        run: mdbook build

  playground:
    name: Playground wasm build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build the interpreter for the browser
        run: cargo build --release --lib --no-default-features --target wasm32-unknown-unknown

  fmt:
    name: Formatting check (std + examples)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build release binary
        run: cargo build --release
      - name: witchy fmt --check
        run: |
          fail=0
          for f in std/*.witchy examples/*/src/*.witchy; do
            if ! ./target/release/witchy fmt --check "$f" >/dev/null 2>&1; then
              echo "needs formatting: $f"
              fail=1
            fi
          done
          exit $fail
