name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege by default: grant nothing at the top level, opt each job in.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  zizmor:
    name: Workflow security audit (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/zizmor.sh --quiet --no-progress --persona=pedantic .github/workflows
      - name: Enforce code-exec / write-authority isolation
        run: ./scripts/workflow-isolation-check.py .github/workflows

  # Sharded across a 4-way GitHub Actions matrix (nextest `--partition
  # count:M/4`) rather than one serial job. A single dev machine can't get
  # past its core-count ceiling, but CI can spin up N independent runners —
  # this is the structural lever that actually cuts CI wall-clock for the
  # unit+integration suite. Each shard runs its own `cargo build` (simplest,
  # lowest-risk design: no cross-job artifact upload/download to get wrong
  # blind, at the cost of ~4x the build compute-minutes vs. building once and
  # sharing artifacts — accepted trade: CI minutes are cheap, wall-clock during
  # review is not). Clippy runs once, on shard 1 only, since it's a single
  # non-partitionable lint pass over the whole workspace and doesn't benefit
  # from sharding. Partitioning only affects which tests each shard EXECUTES;
  # the per-test-group `max-threads` bounds in .config/nextest.toml (e.g.
  # gate-cold-heavy) still apply independently within each
  # shard's own nextest process, so the flakiness-motivated serialization for
  # heavy-compile clusters is unaffected by how the discovered set was
  # split.
  test:
    name: Build and test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest
      - name: Build
        run: cargo build --workspace --all-targets --features witchy-wir/native,witchy-lower/native-test-runtime
      # RFC-0165 A1: package-local feature selection is intentional. The
      # workspace test below also enables native, but this direct invocation
      # prevents Cargo feature unification from silently compiling the WIR
      # security modules out of a package test target. Run once after Build so
      # the focused suites reuse its artifacts; shard 1 is the required owner.
      - name: RFC-0165 native SafeWIR security suites
        if: matrix.shard == 1
        run: |
          bash ./scripts/rfc0165-native-gate-policy-test.sh
          bash ./scripts/rfc0165-native-gate.sh
      - name: Unit + integration tests (partition ${{ matrix.shard }}/4)
        env:
          SHARD: ${{ matrix.shard }}
        # The RFC-0165 deferred-feature tests are excluded by the same script the
        # merge gate uses (scripts/rfc0165-deferred-filter.sh), never by an
        # expression written here; the native security suites stay mandatory.
        run: cargo nextest run --workspace --features witchy-wir/native,witchy-lower/native-test-runtime --profile ci --all-targets --partition "count:${SHARD}/4" -E "$(./scripts/rfc0165-deferred-filter.sh)"

      # Workspace feature unification enables test fixtures. Exercise the
      # production-disabled boundary separately, and reject an empty selection
      # if feature drift compiles this security test out.
      - name: Console fixture imports fail closed without fixture support
        if: matrix.shard == 1
        run: >-
          cargo nextest run -p witchy-runtime --no-default-features --features native
          --profile ci --test console_fixture_disabled --ignore-default-filter
          --no-tests=fail
          -E 'test(=disabled_console_fixture_import_refuses_before_memory_or_output)'

  # SBPL is undocumented and version-sensitive, and a preamble that an OS
  # upgrade invalidates fails as a SIGABRT in dyld with no stderr and no
  # unified-log entry -- the profile denies dyld's own diagnostic write. A local
  # canary is not enough, because a workstation upgrades when its owner decides
  # to and the break stays silent until someone runs a confined program. GitHub
  # rotates the macos-latest image on its own schedule, which is exactly the
  # trigger this job exists to catch, and it catches it on a pull request.
  macos-confinement:
    name: macOS Seatbelt confinement (RFC-0158)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust
      # Covers Policy -> SBPL translation, arming, filesystem read AND write
      # confinement, TCP port denial, and exec inheritance. The arming cases
      # re-exec this test binary as a child because arming is irreversible.
      - name: Provider translation and arming tests
        run: cargo test -p witchy-confinement

  fmt:
    name: Formatting check (std + examples + projects)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust
      - name: Build binary
        run: cargo build -p witchy
      - name: witchy fmt --check
        run: |
          files=(std/*.witchy examples/*/src/*.witchy)
          while IFS= read -r f; do
            files+=("$f")
          done < <(find projects -type f -path '*/src/*.witchy' -print | sort)
          ./target/debug/witchy fmt --check "${files[@]}"
