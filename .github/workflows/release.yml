name: Release

# Build witchy binaries when a version tag is pushed. Artifacts attach to the
# GitHub release for the tag; nothing is published anywhere else.
#
# Least privilege: the `build` jobs run untrusted code (cargo build/test pulls
# in build scripts, proc-macros and the dependency tree) and hold NO write
# token — they only emit tarballs as workflow artifacts. The single `publish`
# job holds `contents: write` but runs no project code: it just downloads those
# artifacts and attaches them via the first-party `gh` CLI.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target "$TARGET"
      - name: Run the test suite
        run: cargo test --workspace --release
      - name: Package
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/witchy" dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          tar -C dist -czf "witchy-$TARGET.tar.gz" .
      - name: Upload the build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: witchy-${{ matrix.target }}
          path: witchy-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: witchy-*
          merge-multiple: true
      - name: Attach the artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" dist/*.tar.gz \
            || gh release upload "$TAG" --clobber dist/*.tar.gz
