name: Docs GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    name: Build docs and publish to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21d7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-rust
        with:
          targets: wasm32-unknown-unknown
      - name: Build Witchy (release)
        run: cargo build --release
      - name: Build browser-playground Wasm
        run: cargo build --release --lib --no-default-features --features browser-fixtures --target wasm32-unknown-unknown
      - name: Build deployable docs bundle
        env:
          WITCHY_BROWSER_WASM: ${{ github.workspace }}/target/wasm32-unknown-unknown/release/witchy.wasm
        run: ./scripts/build-docs.sh dist
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  docs-vitals:
    name: Production docs Core Web Vitals smoke
    needs: [build-and-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21d7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Generate deployed-docs production vitals
        env:
          WITCHY_DOCS_URL: ${{ needs.build-and-publish.outputs.page_url }}
          WITCHY_VITALS_OUT: projects/glamour/acceptance
          WITCHY_LHCI_RUNS: 1
        run: |
          node scripts/docs-vitals.mjs "${WITCHY_DOCS_URL}"
      - name: Upload production vitals artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-vitals-${{ github.sha }}
          path: projects/glamour/acceptance/*.json
          if-no-files-found: error
          retention-days: 14
