name: Publish demo rune (trusted publishing)

# Proves the "outsider can publish via CI" path (RFC-0117 Lane A): a GitHub
# Actions job mints an OIDC identity token for audience `coven-registry` and
# uses it as the SOLE authority to publish the `insanitybit/greeter` demo rune
# to the hosted coven registry. No long-lived secrets — the only inputs are the
# short-lived OIDC token the Actions runtime issues and network to the registry.
#
# Guarded so it cannot fire by accident: manual dispatch only, plus a narrow
# `demo-publish-v*` tag glob. It never runs on pushes or pull requests, so a
# fork PR can neither trigger it nor observe its `id-token` authority.
#
# Isolation invariant (scripts/workflow-isolation-check.py): the toolchain —
# cargo, rustc, and every dependency build script — runs in the `build` job,
# which holds no write authority. The `publish` job holds `id-token: write`
# but never checks out the tree or runs a build; the one thing it executes is
# the sealed `witchy` binary the build job handed it, because witchy IS the
# publishing client and must run where the OIDC token exists. That single
# residual is declared via WORKFLOW_ISOLATION_EXEMPT below.
#
# WHAT MUST BE TRUE SERVER-SIDE for a dispatch to succeed (this workflow cannot
# make these true; the registry operator must):
#   * The live registry (https://witchy.fly.dev) must run `coven-serve` with
#     `--trust-issuer-oidc https://token.actions.githubusercontent.com`. That
#     makes coven fetch GitHub's JWKS at startup and accept RS256 tokens from
#     that issuer, selecting the signing key by the token's `kid` (rotation-safe).
#   * The rune namespace `insanitybit` must equal this repo's `repository_owner`.
#     On the FIRST trusted publish coven binds the namespace to the token's
#     `repository` org (coven.witchy: `ns == namespace_of(repository)`), then
#     pins issuer + repository + workflow_ref; every later publish must match
#     that first binding.
#   * coven verifies the token itself (coven_trust.verify_oidc_fresh): audience
#     is `coven-registry`, the signature is RS256 against the pinned JWKS key,
#     and the token is fresh — `iat` present, signed lifetime <= 600s, <=60s of
#     issuer clock lead, and the `jti` is single-use (replay-rejected).
#
# This publishes ONLY (a version lands STAGED). Promotion of a staged version to
# released requires a human second factor (an MFA/WebAuthn `amr` on the token)
# by design, and is never performed from CI.

on:
  workflow_dispatch:
  push:
    # Narrow glob: only an explicit maintainer-pushed `demo-publish-vX.Y.Z` tag.
    tags: ["demo-publish-v[0-9]+.[0-9]+.[0-9]+"]

# Least privilege by default: grant nothing at the top level, opt each job in.
permissions: {}

env:
  # The hosted coven registry. `witchy pm publish` reads COVEN_URL, preserves the
  # https scheme, and auto-grants Net to exactly this origin (no explicit --net).
  COVEN_URL: https://witchy.fly.dev
  # The demo rune to publish (namespaced insanitybit/greeter — see witchy.toml).
  RUNE_DIR: projects/coven-publish-demo

jobs:
  build:
    name: Build the witchy publisher (no write authority)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Build the witchy toolchain from source with the repo's pinned toolchain.
      # There is no published release artifact a third party can download yet
      # (the release workflow only cuts DRAFT releases), so building the one
      # `witchy` binary is the cheapest correct way to get a publisher here.
      - uses: ./.github/actions/install-rust
      - name: Build the witchy binary
        run: cargo build --release --bin witchy
      # Hand the publisher binary and the rune source to the privileged job.
      # upload-artifact preserves the paths' repo-root-relative layout.
      - name: Upload publisher artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coven-publisher
          path: |
            target/release/witchy
            projects/coven-publish-demo
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish insanitybit/greeter via OIDC (no builds)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the GitHub OIDC identity token
    steps:
      - name: Download publisher artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coven-publisher
          path: .
      - name: Mint OIDC token for coven-registry and publish
        env:
          # Declared isolation residual: this step executes the witchy binary
          # built by the unprivileged job above — witchy is the publishing
          # client, so it must run in the job that holds the OIDC token. No
          # toolchain, checkout, or build script runs here.
          WORKFLOW_ISOLATION_EXEMPT: >-
            executes only the sealed witchy artifact from the unprivileged
            build job; witchy is itself the publishing client
        run: |
          set -euo pipefail

          # Artifact transport drops the execute bit; restore it.
          chmod +x target/release/witchy

          # ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN are exported into this step's
          # process environment by the Actions runtime ONLY because this job has
          # `id-token: write`. They are read straight from the shell env below —
          # not via any GitHub Actions expression, so nothing is interpolated
          # into the command. Request a GitHub OIDC token bound to audience
          # `coven-registry`; the request URL + bearer are the only authority
          # used here and both vanish when the job ends. HTTPS + TLS 1.2 enforced.
          response="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=coven-registry")"

          COVEN_ID_TOKEN="$(printf '%s' "$response" | jq -r '.value')"
          # Keep the JWT out of any log line.
          echo "::add-mask::${COVEN_ID_TOKEN}"
          if [ -z "$COVEN_ID_TOKEN" ] || [ "$COVEN_ID_TOKEN" = "null" ]; then
            echo "::error::could not mint an OIDC token for audience coven-registry"
            exit 1
          fi
          export COVEN_ID_TOKEN

          # Publish only — NOT promote (promote needs a human second factor).
          # The rune lands STAGED under insanitybit/greeter@<version>.
          ./target/release/witchy pm publish "$RUNE_DIR"
