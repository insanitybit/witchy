name: Install Rust
description: Install the pinned Rust toolchain and restore the cargo build cache.
inputs:
  components:
    description: Space-separated rustup components to add (e.g. "clippy", "rustfmt").
    required: false
    default: ""
  targets:
    description: Space-separated compilation targets to add (e.g. "wasm32-unknown-unknown").
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install toolchain
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        # rust-toolchain.toml is the one reviewed pin for local development,
        # the merge gate, and CI. With no explicit name rustup installs that
        # active toolchain, including its base components and targets.
        args=(--no-self-update)
        if [ -n "$COMPONENTS" ]; then
          args+=(--component $COMPONENTS)
        fi
        if [ -n "$TARGETS" ]; then
          args+=(--target $TARGETS)
        fi
        rustup toolchain install "${args[@]}"

    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
