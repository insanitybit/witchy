# mbx build-cache policy for this repository (scripts/bin/cargo routes builds
# through mbx; scripts/mbx-install.sh pins the version). Environment variables
# still win over anything here.
#
# Many worktrees of this one repository build against one shared store. A
# workspace crate that recompiles in a new checkout records that checkout's
# path in its artifact, and every crate above it then misses however little it
# read itself. Remapping the workspace root makes the rebuilt crate
# byte-identical across checkouts so its dependents keep hitting. The price is
# literal source paths in debug information, file!() and panic locations,
# which the gate does not depend on.
share_workspace_root = true

# Agent compiles share mbx's machine-wide permit pool: each rustc waits for a
# permit, so no agent is blocked outright and a long test run holds nothing.
# The serialized merge gate uses mbx only for artifact restore, with scheduling
# disabled, so it never draws from this pool. Capping agents at 4 of this host's
# 10 CPUs leaves the gate the rest. Measured 2026-09-24: over six hours the gate
# was busy 62% of the time, and compiles outside any pool (then the
# worktree-create prebuild) were 28% of busy CPU against the gate's 27%.
# scripts/bin/cargo marks ordinary agent builds low priority, leaving one
# permit available when a normal-priority agent-check presubmit is waiting.
# Test commands must use the same pool too. mbx admits the top-level nextest
# command but does not own nextest's internal worker fanout, so scripts/bin/cargo
# also defaults each non-gate test command to two workers. Without both bounds,
# several agents can push a 10-core host above load 100 while the serialized
# gate is running. The gate remains outside this four-CPU agent pool.
[scheduler]
cpus = 4
tests = true
