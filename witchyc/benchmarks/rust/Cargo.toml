[package]
name = "witchy-benchmark-game-baselines"
version = "0.1.0"
edition = "2015"
publish = false

[dependencies]
bumpalo = "=3.20.3"
rayon = "=1.12.0"
regex = "=1.13.1"
rug = { version = "1.28", default-features = false, features = ["integer"] }
gmp-mpfr-sys = { version = "1.7", default-features = false, features = ["use-system-libs"] }

[[bin]]
name = "revcomp-rust-2"
path = "revcomp-rust-2.rs"

[[bin]]
name = "binarytrees-rust-5"
path = "binarytrees-rust-5.rs"

[[bin]]
name = "regexredux-rust-1"
path = "regexredux-rust-1.rs"

[[bin]]
name = "pidigits-rust-4"
path = "pidigits-rust-4.rs"

[profile.release]
codegen-units = 1
