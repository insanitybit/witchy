host = "trusted-exe"
axis = "runtime"

[enforcement]
filesystem = "linux-landlock"
syscalls = "linux-seccomp"

[grants.Console]
provider = "process-stdio"
determinism = "nondeterministic"
rights = ["Read", "Write"]

[grants.Clock]
provider = "system-clock"
determinism = "nondeterministic"

[grants.Rand]
provider = "system-random"
determinism = "nondeterministic"

[grants.Env]
provider = "process-environment"
determinism = "nondeterministic"

[grants.SecretStore]
provider = "named-secrets"
determinism = "nondeterministic"
source = "environment"

[grants.Dir]
provider = "confined-filesystem"
determinism = "nondeterministic"
rights = ["Read", "Write"]
grant = "cwd-or-path"

[grants.File]
provider = "confined-file"
determinism = "nondeterministic"
rights = ["Read", "Write"]
grant = "path"

[grants.Net]
provider = "pinned-network"
determinism = "nondeterministic"
rights = ["Connect", "Listen", "Tcp", "Udp", "Uds"]
grant = "system-or-address-allowlist"

[grants.Fetch]
provider = "native-http"
determinism = "nondeterministic"
grant = "system-or-origin-allowlist"
redirects = "deny"
buffered = true

[grants.Exec]
provider = "confined-process"
determinism = "nondeterministic"
grant = "system-or-program-allowlist"

[facilities.argv]
provider = "process-argv"
determinism = "nondeterministic"

[facilities.vm]
provider = "wasmtime-worker"
determinism = "deterministic"
