[package]
name = "witchy"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A capability-secure language with twin interpreter and WASM backends: a program's authority is a typed, auditable, enforceable artifact"
license = "MIT OR Apache-2.0"
repository = "https://github.com/insanitybit/witchy"
keywords = ["language", "capability-security", "wasm", "sandbox", "supply-chain"]
categories = ["compilers", "development-tools"]
exclude = [
    ".claude/",
    ".github/",
    "bench/",
    "benchmarks/",
    "bugs/",
    "covenweb-before.png",
    "editors/",
    "external-refs/",
    "justfile",
    "OVERNIGHT_REPORT.md",
    "projects/",
    "proptest-regressions/",
    "rfcs/",
    "runecard-demo.png",
    "scratch/",
    "scripts/",
    "security-eval/",
    "target-*/",
    "tests/",
    "web/",
    "wiki/",
    "AGENTS.md",
    "CLAUDE.md",
]

# cargo-binstall resolves prebuilt release archives from these patterns instead
# of building from source. Archive layout comes from scripts/release-package.sh.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
bin-dir = "{ name }-{ version }-{ target }/bin/{ bin }"
pkg-fmt = "tgz"

# RFC-0018: the compiler is being decomposed into stage-aligned crates under
# crates/. The root `witchy` package is itself a workspace member (the binary +
# the not-yet-extracted stages); extracted crates are listed here.
[workspace]
members = ["crates/witchy-canonical-source", "crates/witchy-cap-model", "crates/witchy-caps", "crates/witchy-compiler-worker", "crates/witchy-confinement", "crates/witchy-interp", "crates/witchy-lower", "crates/witchy-runtime", "crates/witchy-syntax", "crates/witchy-test-host", "crates/witchy-testkit", "crates/witchy-types", "crates/witchy-wir", "crates/witchy-worker-protocol", "tools/merge-queue-tests", "tools/repo-tests", "tools/witchy-snapshot-tools"]

[lib]
name = "witchy"
# Native binaries and tests consume only the rlib. The browser build asks
# rustc for a cdylib explicitly in scripts/build-playground.sh; listing both
# here makes every native root compile emit and link an unused dynamic library.
crate-type = ["rlib"]
doctest = false

[[bin]]
name = "witchy"
path = "src/main.rs"
required-features = ["native"]

[features]
# The full native toolchain (wasmtime sandbox, package manager, LSP). On by
# default; the wasm playground builds the library alone with it OFF.
default = ["native"]
native = ["dep:toml", "dep:aws-lc-rs", "dep:wasmtime", "dep:wasmprinter", "dep:lsp-server", "dep:serde_json", "dep:serde", "dep:tiny_http", "dep:getrandom", "dep:blake3", "dep:witchy-testkit", "dep:mimalloc", "witchy-wir/native", "witchy-caps/native", "witchy-interp/test-fixtures", "witchy-runtime/test-fixtures"]
# The web/static-site commands (glamour, the docs site). Optional since
# 2026-09-21: they are ~28% of the root crate and every build paid for them.
web = []
# Shared deterministic fixture sessions for the opaque-frame browser host.
# Kept out of ordinary library builds; the playground/docs builder enables it.
browser-fixtures = ["dep:serde_json", "dep:witchy-test-host", "dep:witchy-testkit"]

[dependencies]
# Stage-aligned crates extracted from the monolith (RFC-0018). Re-exported from
# lib.rs so existing `crate::{ast,lexer,parser,wir,…}::…` paths keep resolving.
witchy-canonical-source = { path = "crates/witchy-canonical-source" }
witchy-caps = { path = "crates/witchy-caps" }
witchy-confinement = { path = "crates/witchy-confinement" }
witchy-interp = { path = "crates/witchy-interp" }
witchy-lower = { path = "crates/witchy-lower" }
witchy-runtime = { path = "crates/witchy-runtime" }
witchy-syntax = { path = "crates/witchy-syntax" }
witchy-test-host = { path = "crates/witchy-test-host", optional = true }
witchy-testkit = { path = "crates/witchy-testkit", optional = true }
witchy-types = { path = "crates/witchy-types" }
witchy-wir = { path = "crates/witchy-wir" }
# Pure-Rust deps the interpreter library needs on every target (incl. wasm).
sha2 = "0.11.0"
ed25519-dalek = "2.2.0"
regex = "1.11"
wasm-encoder = "0.251"
# Reads back the pre-compiled prelude blob + validates the emitted module; pure
# Rust, so the binary codegen path (WIR -> wasm) runs on the wasm playground too.
wasmparser = "0.251"
# Native-only deps (the sandbox/PM/LSP layers); excluded from the wasm build.
# Keep this identical in every workspace declaration. Witchy selects the DRC
# collector, uses only Wasmtime's synchronous API, rejects Wasm threads and
# proposal stack switching, and compiles no components. Alternate collectors,
# async fibers, guest-debug support and component-only builtins stay out of the
# already-expensive native dependency graph. `debug_info` and trap backtraces
# are separate and remain enabled by the features below.
wasmtime = { version = "45.0.0", optional = true, default-features = false, features = ["anyhow","backtrace","cache","gc","gc-drc","wat","profiling","parallel-compilation","cranelift","pooling-allocator","demangle","addr2line","coredump","debug-builtins","runtime","std"] }
# Diagnostic disassembly of already-admitted bytes, matching the encoder/parser.
wasmprinter = { version = "0.251", optional = true }
# Global allocator for the native binary + every test binary that links this
# lib (see the #[global_allocator] in lib.rs). NOT for the wasm32 playground
# build -- it's native-only and gated by the same `native` feature that build
# already disables. See scripts/gate-test-cost.py's sample findings: ~45-50%
# of an ordinary compile's CPU was in malloc/free/memset on the system
# allocator; mimalloc targets exactly that.
mimalloc = { version = "0.1.52", optional = true }
lsp-server = { version = "0.7.9", optional = true }
serde_json = { version = "1", optional = true }
toml = { version = "1.1.2", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
tiny_http = { version = "0.12.0", optional = true }
getrandom = { version = "0.4.2", optional = true }   # pm key generation (native)
# Keys the source→wasm cache (`compile_linked_to_wasm_cached`) — an INTERNAL
# content-address, not security crypto (sha2/aws-lc stay for everything
# security-relevant). blake3 because the input is the whole Debug rendering of
# a linked AST on every run; it hashes large inputs several times faster.
blake3 = { version = "1.8.3", optional = true }

# ed25519-dalek pulls getrandom transitively; the browser target needs its JS
# backend to link (our crypto is seed-only, so it is never actually called).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# Developer-facing IdP key/token generation lives in the native CLI. Keep its
# C crypto provider out of compiler-only tools such as the snapshot generator.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aws-lc-rs = { version = "1", optional = true }

[dev-dependencies]
proptest = "1.11.0"
# Raw AST lowering is deliberate compiler-test machinery, not a production API.
witchy-lower = { path = "crates/witchy-lower", features = ["raw-module-test-api"] }
# Raw AST execution is deliberate oracle/test machinery, not a production API.
witchy-interp = { path = "crates/witchy-interp", features = ["raw-module-test-api", "test-fixtures"] }
# Raw WIR encoding is deliberate optimizer/oracle test machinery.
# Every test build requests witchy-wir's full test feature set, so all
# selections (-p witchy-wir, -p witchy-lower, --workspace, ...) share ONE
# compiled witchy-wir and everything above it. Each distinct feature set was
# a separate opt-level-2 build of witchy-wir plus every dependent crate in the
# same target dir. Dev-dependency features never reach `cargo build`, so the
# production boundary around the raw encoder is unchanged.
witchy-wir = { path = "crates/witchy-wir", features = ["native", "legacy-encoder-bridge", "raw-encoder-test-api", "checked-source-test-api"] }
# Enables only the concurrency-safe TLS fixture hook for root-package tests.
# The ordinary runtime dependency does not expose it in production builds.
witchy-runtime = { path = "crates/witchy-runtime", features = ["test-support"] }
# Snapshot harness for the diagnostic goldens (RFC-0072): every user-facing
# error string is captured verbatim in src/snapshots/ and reviewed as a diff.
insta = "1.48.0"
# Generates a throwaway self-signed cert for the hermetic TLS client test.
rcgen = "0.13"
# A local TLS server for the hermetic TLS/HTTPS/OAuth tests (mock GitHub) — same
# aws_lc_rs provider as the client, no second crypto stack.
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
# Signs a test id_token for the mock-Google OIDC login e2e (same crypto as the client).
aws-lc-rs = "1"
# The RFC-0095 Cut-6 run-acceptance e2e hashes the built trusted-publisher to author its
# artifact manifest — the same sha2 coven re-verifies the uploaded bytes against.
sha2 = "0.11.0"

# Dev builds keep file:line backtraces (so test failures and panics stay
# legible) but skip full DWARF generation — markedly faster to compile and link
# for this large single crate. Use a debugger build (`debug = 2`) only when you
# actually need to step through variables.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
strip = "symbols"

# Every test build uses ONE profile. The merge gate, check.sh and agent-check
# have always built tests with `CARGO_PROFILE_TEST_STRIP=symbols`; a plain
# `cargo test` / `cargo nextest` run did not. The strip setting is part of the
# profile every unit's hash is computed from, so the two disagreed on every
# crate AND every dependency: one target dir held two complete builds, a
# worktree cloned warm for one rebuilt all 28 deps of witchy-syntax for the
# other, and each edit compiled the compiler twice (measured 2026-09-23).
# Declaring it here makes the env var redundant rather than load-bearing, and
# `dev` strips too: with equal settings `cargo build` and `cargo test` share
# every unit (verified: 29 of 29 fresh across the two), so an ad-hoc binary
# build no longer compiles the compiler a second time. Symbols cost the gate
# (nextest execs every test, and macOS pages the symbol table each time).
# For symbolized panic backtraces while debugging, build with
# `CARGO_PROFILE_DEV_STRIP=none CARGO_PROFILE_TEST_STRIP=none` -- knowing that
# is a separate, full build.
[profile.test]
strip = "symbols"

# Tests run the interpreter and Wasmtime host glue hard, so keep those two hot
# execution crates at level 2. The compiler crates are dominated by codegen on
# edit builds: on 2026-09-24 a warm-dependency lower probe spent 14m28s
# compiling before 63s of tests, and a WIR probe spent 10m59s compiling before
# 17s of tests. Level 1 is the default compromise for compiler stages. Lowering,
# syntax and type checking are exceptions: their focused test execution is now
# only seconds while cold compilation dominates. On 2026-09-25, an otherwise
# warm witchy-types edit compiled in 14.9s at level 0 versus 79s at level 1; the
# next incremental edit was 1.9s versus 3.0s, while 113 tests remained about 3s.
# A syntax-plus-types first rebuild fell from 29.3s to 13.4s; its already-hot
# edit-and-test loop rose only from 8.3s to 10.8s. Reserve optimized compiler
# code for release builds.
# The root crate and external dependencies remain unoptimized for cheap cold
# builds.
#
# The workspace crates also drop line tables (`debug = 0`). With line tables,
# inserting or deleting one line moves the line of every function below it,
# and each codegen unit holding one is rebuilt: in witchy-wir one inserted
# line in canonical_wasmir.rs rebuilt 129 CGUs for 86-94 CPU s, against 82
# CGUs and 40-51 CPU s without (2026-09-25). `strip = "symbols"` already left
# those tables unusable for backtraces; panic messages keep file:line, which
# comes from compiled-in `Location` constants, not debug info. To step through
# one of these crates in a debugger, remove its `debug = 0` locally.
[profile.dev.package.witchy-interp]
opt-level = 2
debug = 0
[profile.dev.package.witchy-runtime]
opt-level = 2
debug = 0
[profile.dev.package.witchy-lower]
opt-level = 0
debug = 0
[profile.dev.package.witchy-wir]
opt-level = 1
debug = 0
[profile.dev.package.witchy-types]
opt-level = 0
debug = 0
[profile.dev.package.witchy-canonical-source]
opt-level = 1
debug = 0
[profile.dev.package.witchy-syntax]
opt-level = 0
debug = 0
[profile.dev.package.witchy]
debug = 0
# foldhash backs the compiler crates' HashMaps; unoptimized it LOSES to std's
# precompiled SipHash (~2% more instructions on a pm-front-end compile), with
# this override it wins. Tiny crate — no build-time cost.
[profile.dev.package.foldhash]
opt-level = 3
# The canonical emitter validates every produced module with wasmparser and
# decodes it again to match the plan mirror; unoptimized, those two passes
# were 27% of a warm async compile in the test suite. Both crates are small,
# so the one-time cost is a short rebuild, not a bigger cache.
# wasmparser's debug-assertions block is a self-check of its OWN operator
# arity table: per validated operator it re-decodes the operator and eagerly
# formats (then drops) a BinaryReaderError via `ok_or(format_err!(..))` --
# 22% of `decode_and_match_plan` on an async test driver (2026-09-24). Our
# validation verdicts do not depend on it.
[profile.dev.package.wasmparser]
opt-level = 3
debug-assertions = false
[profile.dev.package.wasm-encoder]
opt-level = 3
# SafeWIR admission hashes constantly: sha2 for module and recipe digests,
# blake3 for layout-bundle digests. Unoptimized SHA-256 is an order of
# magnitude slower than optimized and showed up as top frames in a checker
# profile (2026-09-13). Small crates, negligible build-time cost.
[profile.dev.package.sha2]
opt-level = 2
[profile.dev.package.blake3]
opt-level = 2
# Wasmtime otherwise namespaces its debug compilation cache by the test
# executable's mtime. Every relink then recompiles unchanged admitted Wasm.
# This crate's sole debug-assertions branch selects that namespace; its cache
# key still binds the Wasm bytes, compiler revision, target, and configuration.
[profile.dev.package.wasmtime-internal-cache]
debug-assertions = false


# aws-lc-sys's build script compiles C probe executables with the package's
# debug setting; on macOS a `-g` executable link leaves a `.dSYM` bundle in
# OUT_DIR whose contents differ on every build. Cargo passes that OUT_DIR to
# every dependent as `-L native=`, so a content-addressed build cache that
# hashes native search directories (mr-boxington does) sees a new key for
# witchy-wir/-lower/-interp/-runtime in every target directory. Nobody debugs
# into AWS-LC from here; drop debug info for that one package so its OUT_DIR is
# reproducible.
[profile.dev.package.aws-lc-sys]
debug = false
