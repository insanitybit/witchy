[package]
name = "witchy"
version = "0.1.0"
edition = "2024"
description = "A capability-secure language with twin interpreter and WASM backends: a program's authority is a typed, auditable, enforceable artifact"
license = "MIT OR Apache-2.0"
repository = "https://github.com/insanitybit/witchy"
keywords = ["language", "capability-security", "wasm", "sandbox", "supply-chain"]
categories = ["compilers", "development-tools"]

[dependencies]
wasmtime = "45.0.0"
lsp-server = "0.7.9"
serde_json = "1"
toml = "1.1.2"
sha2 = "0.11.0"
serde = { version = "1.0.228", features = ["derive"] }
ed25519-dalek = "2.2.0"
getrandom = "0.4.2"
tiny_http = "0.12.0"

[dev-dependencies]
proptest = "1.11.0"
