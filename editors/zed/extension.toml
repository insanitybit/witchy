id = "witchy"
name = "Witchy"
version = "0.1.0"
schema_version = 1
authors = ["Colin OBrien <insanitybit@gmail.com>"]
description = "Witchy language support: syntax highlighting and type diagnostics."
repository = "https://github.com/insanitybit/witchy"

[grammars.witchy]
# Tree-sitter grammar repo. Update `rev` after committing grammar changes,
# then reinstall the dev extension so Zed rebuilds the parser.
repository = "https://github.com/insanitybit/tree-sitter-witchy"
rev = "e06a1dc96ab9e4d4638ccb653c835fb6d5622d23"

[language_servers.witchy]
name = "Witchy LSP"
languages = ["Witchy"]
