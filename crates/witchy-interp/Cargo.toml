[package]
name = "witchy-interp"
version = "0.1.0"
edition = "2024"
publish = false            # internal workspace crate — not published standalone
license = "MIT OR Apache-2.0"
description = "witchy compiler — the reference interpreter (parity oracle) + compile-time evaluation"

# Wasm-safe: the tree-walker is the playground's run path. No external crates
# beyond no_std-clean foldhash (the call path's lookup tables; also used by the
# other stage crates) and no native gate — the tests are plain #[cfg(test)] units.
[dependencies]
foldhash = "0.2.0"
witchy-caps = { path = "../witchy-caps" }
witchy-runtime = { path = "../witchy-runtime" }
witchy-syntax = { path = "../witchy-syntax" }
witchy-types = { path = "../witchy-types" }
