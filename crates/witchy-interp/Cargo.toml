[package]
name = "witchy-interp"
version = "0.1.0"
edition = "2024"
publish = false            # internal workspace crate — not published standalone
license = "MIT OR Apache-2.0"
description = "witchy compiler — frozen source evaluator and temporary compile-time services"

[lib]
# No second cfg(test) compile of this crate: it has no tests (frozen tree walker).
test = false
doctest = false

[features]
test-fixtures = ["dep:witchy-test-host", "dep:witchy-testkit"]
# Synthetic AST and oracle tests intentionally exercise execution below the
# checked pipeline. Production dependents receive only proof-carrying entries.
raw-module-test-api = []

# Wasm-safe while the playground still uses this frozen tree walker. The
# production runtime and semantic oracle are the admitted-Wasm and canonical
# SafeWIR paths respectively; do not add new language semantics here.
[dependencies]
foldhash = "0.2.0"
witchy-caps = { path = "../witchy-caps" }
witchy-compiler-services = { path = "../witchy-compiler-services" }
witchy-runtime = { path = "../witchy-runtime" }
witchy-syntax = { path = "../witchy-syntax" }
witchy-test-host = { path = "../witchy-test-host", optional = true }
witchy-testkit = { path = "../witchy-testkit", optional = true }
witchy-types = { path = "../witchy-types" }

[dev-dependencies]
# Share the one test build of witchy-wir (see crates/witchy-wir/Cargo.toml).
witchy-wir = { path = "../witchy-wir", features = ["native", "raw-encoder-test-api", "checked-source-test-api"] }
