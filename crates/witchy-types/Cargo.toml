[package]
name = "witchy-types"
version = "0.1.0"
edition = "2024"
publish = false            # internal workspace crate — not published standalone
license = "MIT OR Apache-2.0"
description = "witchy compiler — type checking, trait resolution, and monomorphization"

# Depends only on the front-end; the tests are plain #[cfg(test)] units (no
# wasmtime), so this crate builds on every target including the wasm playground.
# The library's own `cfg(test)` build is a second full compile of the crate;
# its tests live in tests/ as one integration binary instead.
[lib]
test = false
doctest = false

[dependencies]
witchy-canonical-source = { path = "../witchy-canonical-source" }
witchy-cap-model = { path = "../witchy-cap-model" }
witchy-caps = { path = "../witchy-caps" }
witchy-syntax = { path = "../witchy-syntax" }
# Fast non-DoS-resistant hasher for the checker's internal tables (keys are
# compiler-internal strings/ids, never attacker-controlled collections).
# Matches the runtime dict's foldhash-style choice (8dc801c). no_std-clean
# (ASLR-seeded, no getrandom), so the wasm playground build keeps working.
foldhash = "0.2.0"
blake3 = "1.8.3"
postcard = { version = "1.1.3", features = ["use-std"] }
sha2 = "0.11.0"
