[package]
name = "witchy-runtime"
version = "0.1.0"
edition = "2024"
publish = false            # internal workspace crate — not published standalone
license = "MIT OR Apache-2.0"
description = "witchy compiler — runtime values, the capability host registry, and the wasmtime sandbox (TCB)"

[lib]
# No second cfg(test) compile of this opt-level-2 crate (it was the tail of
# every gate test build). Test bodies sit beside the internals they check,
# behind `self-checks`, and tests/runtime.rs drives each one by its old name.
# (No `[[test]]` table with required-features: an explicit target table makes
# the gate's target-naming proof in test-for-paths.sh fail safe to whole
# packages. The binary is `#![cfg(feature = "self-checks")]` instead.)
test = false

[dependencies]
witchy-cap-model = { path = "../witchy-cap-model" }
witchy-caps = { path = "../witchy-caps" }
witchy-confinement = { path = "../witchy-confinement" }
witchy-syntax = { path = "../witchy-syntax" }
witchy-wir = { path = "../witchy-wir" }
witchy-test-host = { path = "../witchy-test-host", optional = true }
witchy-testkit = { path = "../witchy-testkit", optional = true }
# Pure-Rust crypto for the wasm-safe path (the playground never runs
# security-critical crypto); the native path below uses aws-lc-rs instead.
sha2 = "0.11.0"
ed25519-dalek = "2.2.0"
regex = "1.11"
wasmparser = { version = "0.251", optional = true }
wasm-encoder = { version = "0.251", optional = true }
# The wasmtime sandbox + its randomness (native-only).
wasmtime = { version = "49.0.0", optional = true, default-features = false, features = ["anyhow","backtrace","cache","gc","gc-drc","wat","profiling","parallel-compilation","cranelift","pooling-allocator","demangle","addr2line","coredump","debug-builtins","runtime","std"] }
getrandom = { version = "0.4.2", optional = true }

# aws-lc-rs (FIPS-capable) backs native crypto; rustls (aws_lc_rs provider) is the
# `tls:` client. Both build C and have no wasm32 support, so the wasm build keeps
# the pure-Rust sha2/ed25519 path and omits TLS.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aws-lc-rs = { version = "1", optional = true }
# (RFC-0106) Native-only SHAKE XOF via AWS-LC's EVP interface, which aws-lc-rs's
# safe digest API does not expose. Pinned to the same AWS-LC build aws-lc-rs
# selects (transitive already), so no second crypto provider is introduced —
# and so cargo doesn't compile aws-lc-sys's C sources twice (a real ~50s
# duplicate build observed 2026-08-09). This drifts out of sync whenever
# aws-lc-rs bumps its own aws-lc-sys requirement; check `cargo tree -i
# aws-lc-sys` for a duplicate before assuming this pin is still current.
aws-lc-sys = { version = "0.41", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "aws_lc_rs", "tls12", "logging"] }
webpki-roots = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }
# RFC-0103: portable, descriptor/handle-anchored filesystem traversal. These are
# native-only because the browser build has no host filesystem.
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
tempfile = "3.27.0"

# ed25519-dalek pulls getrandom transitively; the browser target needs its JS
# backend to link (crypto is seed-only here, so it is never actually called).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# Safe file-descriptor passing for race-free execution of a confined file.
[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
cap-std-ext = "5.1.2"

[dev-dependencies]
# Combined checked-heap/UAF tests assemble the exact WIR allocator helpers.
witchy-wir = { path = "../witchy-wir", features = ["native", "raw-encoder-test-api", "checked-source-test-api"] }
# Every test build requests witchy-wir's full test feature set, so all
# selections (-p witchy-wir, -p witchy-lower, --workspace, ...) share ONE
# compiled witchy-wir and everything above it. Each distinct feature set was
# a separate opt-level-2 build of witchy-wir plus every dependent crate in the
# same target dir. Dev-dependency features never reach `cargo build`, so the
# production boundary around the raw encoder is unchanged.
wasm-encoder = "0.251"

[features]
native = ["dep:aws-lc-rs", "dep:aws-lc-sys", "dep:getrandom", "dep:rustls", "dep:wasmparser", "dep:wasmtime", "dep:webpki-roots", "dep:rustls-pemfile"]
test-fixtures = ["native", "dep:witchy-test-host", "dep:witchy-testkit"]
# Exposes the scoped TLS-root registry used by the root package's hermetic
# integration tests. Normal builds cannot add trust anchors through this API.
test-support = ["native"]
# Compiles the former in-crate tests into the library as `#[doc(hidden)] pub`
# functions for tests/runtime.rs. The root package's dev-dependency enables it,
# so every workspace test build (and every shim `-p` selection) has it; it
# only adds features a test build already requests.
self-checks = ["native", "dep:wasm-encoder", "witchy-wir/native", "witchy-wir/raw-encoder-test-api", "witchy-wir/checked-source-test-api"]
