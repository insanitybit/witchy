[package]
name = "witchy-runtime"
version = "0.1.0"
edition = "2024"
publish = false            # internal workspace crate — not published standalone
license = "MIT OR Apache-2.0"
description = "witchy compiler — runtime values, the capability host registry, and the wasmtime sandbox (TCB)"

[dependencies]
witchy-cap-model = { path = "../witchy-cap-model" }
witchy-caps = { path = "../witchy-caps" }
witchy-confinement = { path = "../witchy-confinement" }
witchy-syntax = { path = "../witchy-syntax" }
witchy-wir = { path = "../witchy-wir" }
witchy-test-host = { path = "../witchy-test-host", optional = true }
witchy-testkit = { path = "../witchy-testkit", optional = true }
# Pure-Rust crypto for the wasm-safe path (the playground never runs
# security-critical crypto); the native path below uses aws-lc-rs instead.
sha2 = "0.11.0"
ed25519-dalek = "2.2.0"
regex = "1.11"
wasmparser = { version = "0.251", optional = true }
# The wasmtime sandbox + its randomness (native-only).
wasmtime = { version = "45.0.0", optional = true }
getrandom = { version = "0.4.2", optional = true }

# aws-lc-rs (FIPS-capable) backs native crypto; rustls (aws_lc_rs provider) is the
# `tls:` client. Both build C and have no wasm32 support, so the wasm build keeps
# the pure-Rust sha2/ed25519 path and omits TLS.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aws-lc-rs = "1"
# (RFC-0106) Native-only SHAKE XOF via AWS-LC's EVP interface, which aws-lc-rs's
# safe digest API does not expose. Pinned to the same AWS-LC build aws-lc-rs
# selects (transitive already), so no second crypto provider is introduced —
# and so cargo doesn't compile aws-lc-sys's C sources twice (a real ~50s
# duplicate build observed 2026-08-09). This drifts out of sync whenever
# aws-lc-rs bumps its own aws-lc-sys requirement; check `cargo tree -i
# aws-lc-sys` for a duplicate before assuming this pin is still current.
aws-lc-sys = "0.41"
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12", "logging"] }
webpki-roots = "0.26"
rustls-pemfile = "2"
# RFC-0103: portable, descriptor/handle-anchored filesystem traversal. These are
# native-only because the browser build has no host filesystem.
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
tempfile = "3.27.0"

# ed25519-dalek pulls getrandom transitively; the browser target needs its JS
# backend to link (crypto is seed-only here, so it is never actually called).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# Safe file-descriptor passing for race-free execution of a confined file.
[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
cap-std-ext = "5.1.2"

[dev-dependencies]
# Combined checked-heap/UAF tests assemble the exact WIR allocator helpers.
witchy-wir = { path = "../witchy-wir", features = ["raw-encoder-test-api"] }
wasm-encoder = "0.251"

[features]
native = ["dep:wasmtime", "dep:getrandom", "dep:wasmparser"]
test-fixtures = ["native", "dep:witchy-test-host", "dep:witchy-testkit"]
# Exposes the scoped TLS-root registry used by the root package's hermetic
# integration tests. Normal builds cannot add trust anchors through this API.
test-support = []
