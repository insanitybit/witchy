[package]
name = "witchy-wir"
version = "0.1.0"
edition = "2024"
publish = false            # internal workspace crate — not published standalone
license = "MIT OR Apache-2.0"
description = "witchy compiler — the WIR intermediate representation, peephole opt, runtime-helper prelude, and wasm encoder"

[dependencies]
# Pure-Rust; available on every target including the wasm playground.
wasm-encoder = "0.251"
wasmparser = "0.251"
# The shared runtime-abort message templates (RFC-0045): the abort helpers bake
# `DiagTemplate::id()` into their `__witchy_abort` calls, so the template ids
# stay single-sourced. `witchy-syntax` is dependency-free, so no cycle.
witchy-syntax = { path = "../witchy-syntax" }
# Compiler-internal encoder tables (function/local names). foldhash, not SipHash:
# same choice as typeck / the interpreter. See [profile.dev.package.foldhash].
foldhash = "0.2.0"
# The validation/test helpers that execute an emitted module under wasmtime
# (native-only — off in the wasm build).
wasmtime = { version = "45.0.0", optional = true }

[features]
native = ["dep:wasmtime"]
# Synthetic WIR and optimizer-oracle tests intentionally encode unchecked
# modules. Normal dependents receive only the fallible production boundary.
raw-encoder-test-api = []
