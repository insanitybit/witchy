[package]
name = "witchy-wir"
version = "0.1.0"
edition = "2024"
publish = false            # internal workspace crate — not published standalone
license = "MIT OR Apache-2.0"
description = "witchy compiler — the WIR intermediate representation, peephole opt, runtime-helper prelude, and wasm encoder"

# No cfg(test) copy of this crate: its in-crate checks are `self_checks`
# modules behind `raw-encoder-test-api`, driven from `tests/unit.rs`.
[lib]
test = false
doctest = false

[build-dependencies]
# build.rs stamps the checker's persistent verdict store with a source digest.
blake3 = "1.8.3"

[dependencies]
# Pure-Rust; available on every target including the wasm playground.
wasm-encoder = "0.251"
wasmparser = "0.251"
# The shared runtime-abort message templates (RFC-0045): the abort helpers bake
# `DiagTemplate::id()` into their `__witchy_abort` calls, so the template ids
# stay single-sourced. `witchy-syntax` is dependency-free, so no cycle.
witchy-syntax = { path = "../witchy-syntax" }
# The checked-source contract (RFC-0170): aggregate shapes and capability
# representations shared with the checker without depending on it.
witchy-canonical-source = { path = "../witchy-canonical-source" }
# Compiler-internal encoder tables (function/local names). foldhash, not SipHash:
# same choice as typeck / the interpreter. See [profile.dev.package.foldhash].
foldhash = "0.2.0"
# Cryptographic identity for canonical SafeWIR optimization history.
sha2 = "0.11.0"
tiny-keccak = { version = "2.0.2", features = ["sha3", "shake"] }
blake3 = "1.8.3"
regex = "1.11"
# The validation/test helpers that execute an emitted module under wasmtime
# (native-only — off in the wasm build).
wasmtime = { version = "45.0.0", optional = true, default-features = false, features = ["anyhow","backtrace","cache","gc","gc-drc","wat","profiling","parallel-compilation","cranelift","pooling-allocator","demangle","addr2line","coredump","debug-builtins","runtime","std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Only the primitive is shared with the platform crypto provider. Canonical
# oracle slice decoding and status semantics do not call the runtime registry.
aws-lc-rs = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ed25519-dalek = "2.2.0"

[features]
native = ["dep:wasmtime"]
# The lowerer is the one remaining production caller of the transitional
# source-map bridge. Keep that authority separate from the raw test surface.
legacy-encoder-bridge = []
# Synthetic WIR and optimizer-oracle tests intentionally encode unchecked
# modules. Normal dependents receive only the fallible production boundary.
raw-encoder-test-api = []
# SafeWIR cases that judge a real checked source (RFC-0170 P4). witchy-wir
# cannot depend on the checker, even for tests, so witchy-lower's
# tests/safewir_checked_source.rs drives them through this hidden surface. It
# exposes only case functions that assert and return `()`; it mints nothing.
checked-source-test-api = []

[dev-dependencies]
# Every test build requests witchy-wir's full test feature set, so all
# selections (-p witchy-wir, -p witchy-lower, --workspace, ...) share ONE
# compiled witchy-wir and everything above it. Each distinct feature set was
# a separate opt-level-2 build of witchy-wir plus every dependent crate in the
# same target dir. Dev-dependency features never reach `cargo build`, so the
# production boundary around the raw encoder is unchanged.
witchy-wir = { path = ".", features = ["native", "legacy-encoder-bridge", "raw-encoder-test-api", "checked-source-test-api"] }
syn = { version = "2", features = ["full", "visit"] }
# No checker crate, not even here (RFC-0170 P4): a dev-dependency reaches every
# test target, so a checker edit would rebuild them all. Cases that need a real
# checked source run from witchy-lower through `checked-source-test-api`.
# check-stage-dependencies.py pins the absence.
