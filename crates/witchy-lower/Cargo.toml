[package]
name = "witchy-lower"
version = "0.1.0"
edition = "2024"
publish = false            # internal workspace crate — not published standalone
license = "MIT OR Apache-2.0"
description = "witchy compiler — AST→WIR lowering (the compiled backend's front half)"

[lib]
# No second cfg(test) compile of this crate: its tests live in tests/ and drive the public API.
test = false
doctest = false

[[example]]
name = "scalar_callback_codegen"
required-features = ["native-test-runtime"]

[features]
# Wasmtime execution is a separate, explicitly selected conformance layer.
# Ordinary lowerer tests inspect the emitted WIR/Wasm and rejection contracts
# without compiling the native runtime graph.
native-test-runtime = ["dep:wasmtime", "witchy-wir/native"]

# Non-test code is pure (it builds WIR via witchy-wir), so this crate is
# wasm-clean. Only the explicit native-test-runtime campaign runs emitted
# modules under Wasmtime.
[dependencies]
witchy-syntax = { path = "../witchy-syntax" }
witchy-canonical-source = { path = "../witchy-canonical-source" }
witchy-types = { path = "../witchy-types" }
witchy-wir = { path = "../witchy-wir" }
# Fast non-DoS-resistant hasher for internal tables (see witchy-types).
foldhash = "0.2.0"
sha2 = "0.11.0"
# Validates the emitted module; pure Rust, so the lowering path stays wasm-clean.
wasmparser = "0.251"
# Test-only in practice, but optional normal dependencies are the only Cargo
# dependencies that a package feature can enable for integration tests.
wasmtime = { version = "49.0.0", optional = true, default-features = false, features = ["anyhow","backtrace","cache","gc","gc-drc","wat","profiling","parallel-compilation","cranelift","pooling-allocator","demangle","addr2line","coredump","debug-builtins","runtime","std"] }

[dev-dependencies]
# Every test build requests witchy-wir's full test feature set, so all
# selections (-p witchy-wir, -p witchy-lower, --workspace, ...) share ONE
# compiled witchy-wir and everything above it. Each distinct feature set was
# a separate opt-level-2 build of witchy-wir plus every dependent crate in the
# same target dir. Dev-dependency features never reach `cargo build`, so the
# production boundary around the raw encoder is unchanged.
witchy-wir = { path = "../witchy-wir", features = ["raw-encoder-test-api", "checked-source-test-api"] }
