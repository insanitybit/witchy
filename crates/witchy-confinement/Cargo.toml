[package]
name = "witchy-confinement"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Target-neutral derived platform-confinement policy for Witchy hosts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/insanitybit/witchy"

[lib]
doctest = false

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.5"

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64", target_arch = "riscv64")))'.dependencies]
libc = "0.2.186"
seccompiler = "0.5.0"
syscalls = "0.8.1"
